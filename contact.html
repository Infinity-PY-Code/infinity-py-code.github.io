<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact - Infinity-PY-Code</title>
    <meta name="description" content="Get in touch with Infinity-PY-Code" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#7c5cff;--glass:rgba(255,255,255,0.04)}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#e6eef8;background:linear-gradient(180deg,#071022 0%,#071827 100%)}
      .container{max-width:980px;margin:48px auto;padding:24px}
      header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
      .brand{display:flex;align-items:center;gap:12px}
      .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3ddbd9);display:flex;align-items:center;justify-content:center;font-weight:700;color:white}
      h1{font-size:1.6rem;margin:0}
      p.lead{color:var(--muted);margin:6px 0 0}
      nav a{color:var(--muted);text-decoration:none;margin-left:16px;transition:color 0.2s}
      nav a:hover{color:var(--accent)}
      .card{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
      .btn{padding:10px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
      .btn-primary{background:var(--accent);color:white;transition:opacity 0.2s}
      .btn-primary:hover{opacity:0.9}
      .btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04);transition:color 0.2s}
      .btn-ghost:hover{color:var(--accent)}
      .small{font-size:0.9rem;color:var(--muted)}
      footer{margin-top:36px;color:var(--muted);text-align:center;font-size:0.9rem}
      .contact-content{display:grid;grid-template-columns:1fr;gap:24px}
      .form-container{border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
      .form-container iframe{width:100%;height:800px;border:none}
      h2{margin-top:0;color:#e6eef8}
      @media (max-width:880px){.hero{grid-template-columns:1fr;}.logo{width:48px;height:48px}.form-container iframe{height:600px}}
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">IP</div>
          <div>
            <h1>Infinity-PY-Code</h1>
            <p class="lead">Get in touch</p>
          </div>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="https://github.com/Infinity-PY-Code" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </header>

      <main class="contact-content">
        <section class="card">
          <h2>Contact Us</h2>
          <p class="small">Have a question, suggestion, or want to collaborate? Fill out the form below and we'll get back to you soon.</p>
        </section>

        <div class="form-container">
          <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfGccFk9bVcNcJKgMUW0H_gnXY0gSIxZWzks8TkAfsGPTquYA/viewform?embedded=true" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </main>

      <footer>
        Built with Python ❤️ — <a href="https://github.com/Infinity-PY-Code" target="_blank" rel="noopener">Infinity-PY-Code</a>
      </footer>
    </div>
  </body>
</html>
