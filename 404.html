<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page not found</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#7dd3fc;--muted:#93a7bd}
    html,body{height:100%;margin:0;font-family:Inter, Roboto, -apple-system, system-ui, "Segoe UI", "Helvetica Neue", Arial; background:linear-gradient(180deg,#071027 0%, #0f1724 100%);color:#e6f0fb}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:48px}
    .card{max-width:820px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:48px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.6);}
    h1{font-size:96px;margin:0 0 8px;line-height:1;color:var(--accent)}
    h2{margin:0 0 16px;font-size:20px;color:#eaf6ff}
    p{margin:0 0 18px;color:var(--muted)}
    .actions{display:flex;gap:12px;margin-top:8px}
    .btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;color:#072433;background:#e6f0fb;border:0;font-weight:600}
    .btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(125,211,252,0.16)}
    footer{margin-top:18px;color:rgba(230,240,251,0.55);font-size:13px}
    @media (max-width:640px){h1{font-size:56px}.card{padding:28px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>We couldn't find the page you're looking for. It may have been moved, renamed, or never existed.</p>
      <div class="actions">
        <a class="btn" href="/">Go to homepage</a>
        <a class="btn secondary" href="https://github.com/Infinity-PY-Code/infinity-py-code.github.io/issues/new" target="_blank" rel="noopener">Report a broken link</a>
      </div>
      <footer>If you typed the URL manually, check for typos. Otherwise try navigating from the homepage.</footer>
    </div>
  </div>
</body>
</html>
