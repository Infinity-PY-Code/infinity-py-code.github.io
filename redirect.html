<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        p {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .home-btn {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .home-btn:hover {
            background-color: #2563eb;
        }
    </style>
    <script>
        // Parse the query parameter 'page' from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('page');

        if (targetPage) {
            // Immediate redirect if 'page' parameter exists
            window.location.replace(targetPage);
        } else {
            // Fallback content if no 'page' parameter is provided
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('message').textContent = 'No destination specified.';
                document.getElementById('redirect-link').style.display = 'none';
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Redirecting...</h1>
        <p id="message">Please wait while we take you to your destination.</p>
        <a id="redirect-link" href="/" class="home-btn">Click here if not redirected</a>
    </div>
</body>
</html>
